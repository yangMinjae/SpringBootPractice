<!doctype html>
<html lang="en">
<link rel="stylesheet" href="/main.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <form id = "signupForm">
        <input name="name" placeholder="이름">
        <input name="loginId" placeholder="아이디">
        <input name="password" type="password" placeholder="password">
        <button type="submit" id="btn1">전송</button>
    </form>

<script type="text/javascript">
    const signupForm = document.querySelector('#signupForm');


    signupForm.addEventListener('submit', async (e) => {
        // [중요] 동기식 전송(새로고침)을 막습니다.
        e.preventDefault();

        // 1. Form 안의 데이터를 한 번에 수집
        const formData = new FormData(e.target); // e.target은 signupForm을 가리킵니다.

        // 2. FormData를 순수 자바스크립트 객체(Object)로 변환
        const dataObj = Object.fromEntries(formData.entries());

        // 3. 값 추출 및 공백 제거(trim) 처리
        const name = dataObj.name.trim();
        const loginId = dataObj.loginId.trim();
        const password = dataObj.password.trim();

        // --- 검증 로직 시작 ---
        if (!loginId || loginId.length < 4 || loginId.length > 20) {
            alert("아이디는 4~20자 사이여야 하며 필수 입력 값입니다.");
            return;
        }

        const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;
        if (!passwordRegex.test(password)) {
            alert("비밀번호는 8자 이상, 영문, 숫자, 특수문자를 모두 포함해야 합니다.");
            return;
        }

        if (!name) {
            alert("이름은 필수 입력 값입니다.");
            return;
        }
        // --- 검증 로직 끝 ---

        const data = {
            name : name,
            loginId : loginId,
            password : password
        };

        try {
            const response = await fetch('/member', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("회원가입 완료");
                location.href = "/list";
            } else {
                const rawData = await response.text();
                try {
                    const errors = JSON.parse(rawData);
                    const firstKey = Object.keys(errors)[0];
                    alert(errors[firstKey]);
                } catch (err) {
                    alert(rawData);
                }
            }
        } catch (error) {
            console.error(error);
            alert('전송 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
